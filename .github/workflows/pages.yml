name: Deploy PhotoJoy Pages
on:
  push:
    branches: [codex/web-version]
    paths:
      [
        "pages/**",
        "database.rules.json",
        "firebase.json",
        "models/manifest.json",
        "licenses/**",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photojoy-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - run: npm ci
        working-directory: pages
      - run: npm test
        working-directory: pages
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify private account roster rules and synchronization
        run: npx --yes --package=firebase-tools@15.34.2 firebase emulators:exec --project demo-photojoy --only database "node pages/scripts/test-roster-rules.mjs"
      - run: npm run build
        working-directory: pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
