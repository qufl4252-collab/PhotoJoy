name: PhotoJoy Web tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-web.txt pytest==8.4.2 httpx==0.28.1
      - run: python -m pytest tests/test_core.py tests/test_web.py -q
      - run: node --check photojoy_web/static/app.js
