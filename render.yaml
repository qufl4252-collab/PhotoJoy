# Template only. Review hosting and persistent disk cost before deploying.
services:
  - type: web
    name: photojoy
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-web.txt && python scripts/prepare_models.py
    startCommand: uvicorn photojoy_web.app:app_factory --factory --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: PHOTOJOY_DATA_DIR
        value: /data
      - key: PHOTOJOY_REGISTRATION
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: photojoy-data
      mountPath: /data
      sizeGB: 10
